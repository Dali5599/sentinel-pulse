<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="1080" cy="180" r="240" fill="#10b981" opacity="0.14" filter="url(#glowLight)"/>
  <circle cx="220" cy="500" r="280" fill="#3b82f6" opacity="0.10" filter="url(#glowLight)"/>

  <!-- Brand Pill Header -->
  <g transform="translate(120, 110)">
    <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#047857" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#34d399"/>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#e2e8f0" letter-spacing="1">OPEN SOURCE • 2026</text>
  </g>

  <!-- Main Title -->
  <text x="120" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="64" fill="url(#themeGrad)" letter-spacing="-1">SENTINEL PULSE</text>

  <!-- Description / Subtitle -->
  <text x="120" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    <tspan x="120" dy="0">Autonomous system resource monitor with rich terminal HUD and webhook </tspan>
    <tspan x="120" dy="32">alerts</tspan>
  </text>

  <!-- Feature Badges -->
  
        <g transform="translate(120, 460)">
          <rect width="130" height="38" rx="10" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">MONITORING</text>
        </g>
        
        <g transform="translate(265, 460)">
          <rect width="130" height="38" rx="10" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">SYSTEM MONITOR</text>
        </g>
        
        <g transform="translate(410, 460)">
          <rect width="130" height="38" rx="10" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">DEVOPS</text>
        </g>
        
        <g transform="translate(555, 460)">
          <rect width="130" height="38" rx="10" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">AUTOMATION</text>
        </g>
        

  <!-- Logo Mark on Right Side -->
  <g transform="translate(900, 200)">
    <rect width="240" height="240" rx="60" fill="#0f172a" stroke="#047857" stroke-width="3"/>
    <rect width="240" height="240" rx="60" fill="none" stroke="url(#themeGrad)" stroke-width="2" opacity="0.7"/>
    <g transform="translate(56, 56) scale(5.3)">
      
        <path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6l-8-4zm0 4.2c2.8 1.15 5.5 1.5 6 1.6v4.2c0 4.25-2.85 8.35-6 9.6-3.15-1.25-6-5.35-6-9.6V7.8c.5-.1 3.2-.45 6-1.6zm-1 4.8v6h2v-6h-2zm0-4v2h2V7h-2z" fill="url(#themeGrad)"/>
        
    </g>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(120, 565)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
      Autonomously engineered with precision by <tspan font-weight="700" fill="#94a3b8">Requin AI Agent</tspan> • GitHub: <tspan fill="#34d399">Dali5599</tspan>
    </text>
  </g>
</svg>